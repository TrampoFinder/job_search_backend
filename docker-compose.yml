version: '3.8'

name: 'jobs_search'

services:
  db:
    image: postgres:15-alpine
    container_name: jobs_search
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=jobs_search
    ports:
      - '5432:5432'
    volumes:
      - .data:/var/lib/postgresql/data
